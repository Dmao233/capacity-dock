name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: macOS tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Test
        run: swift test
      - name: Release build
        run: swift build -c release
