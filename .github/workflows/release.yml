name: Release

on:
  push:
    tags:
      - "v*"
  # Manual release from the Actions tab (or API) when a tag cannot be pushed:
  # builds the selected ref and creates the tag on that commit when publishing.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.3.4"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-15
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Test
        run: swift test
      - name: Package
        run: Scripts/package-app.sh "${TAG}"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${TAG#v}"
          DIST=".build/dist"
          PKG="${DIST}/CapacityDock-${VERSION}.pkg"
          DMG="${DIST}/CapacityDock-${VERSION}.dmg"
          ZIP="${DIST}/CapacityDock-${VERSION}.zip"
          SUMS="${DIST}/SHA256SUMS"
          NOTES="$(mktemp)"
          {
            echo "## Capacity Dock ${VERSION}"
            echo
            awk -v version="${VERSION}" '
              $0 == "## " version { active = 1; next }
              active && /^## / { exit }
              active { print }
            ' CHANGELOG.md
            echo
            echo "macOS 14+ 通用二进制（arm64 + x86_64），ad-hoc 签名。"
            echo
            echo "- \`CapacityDock-${VERSION}.pkg\` — 双击安装到 /Applications"
            echo "- \`CapacityDock-${VERSION}.dmg\` — 拖到 Applications"
            echo "- \`CapacityDock-${VERSION}.zip\` — 解压后拷贝 .app"
            echo
            echo "浏览器下载后若无法打开，对安装包 **右键 → 打开**，或："
            echo
            echo '```bash'
            echo "xattr -d com.apple.quarantine ~/Downloads/CapacityDock-${VERSION}.pkg"
            echo '```'
            echo
            echo "Checksum:"
            echo
            echo '```'
            cat "${SUMS}"
            echo '```'
          } > "${NOTES}"
          FILES=("${PKG}" "${DMG}" "${ZIP}" "${SUMS}")
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${FILES[@]}" --clobber
          else
            gh release create "${TAG}" "${FILES[@]}" \
              --target "${GITHUB_SHA}" \
              --title "Capacity Dock ${VERSION}" \
              --notes-file "${NOTES}"
          fi
